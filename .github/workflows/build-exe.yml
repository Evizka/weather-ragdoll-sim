name: Build EXE

on:
  push:
    branches: [arena/4103fe33-weather-ragdoll-sim, main]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Weather-Ragdoll-Sim-Windows
          path: release/*.exe
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Weather-Ragdoll-Sim-Windows-Installer
          path: release/*.exe
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Weather-Ragdoll-Sim-Linux
          path: release/*
          if-no-files-found: warn
